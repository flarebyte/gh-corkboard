name: Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: CI passed
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Lint
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: |
          GOBIN="$RUNNER_TEMP" go install github.com/flarebyte/gh-flarebyte/cmd/gh-flarebyte@v0.30.0
          "$RUNNER_TEMP/gh-flarebyte" build --target linux-amd64
